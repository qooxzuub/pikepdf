name: Build and upload to PyPI

on:
  push:
    branches:
      - "**"
  pull_request: {}

# For musllinux support, see note in pyproject.toml

jobs:
  wheels_linux:
    name: ${{ matrix.platform }} (${{ matrix.optimization }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [manylinux_x86_64]
        optimization: [standard, lto]
        include:
          - optimization: standard
            cflags: "-O3"
            ldflags: ""
            before_all: >
              yum install -y libjpeg-turbo-devel libxml2-devel libxslt-devel zlib-devel openssl-devel libxmp
            env_extra: >
              QPDF_PATTERN="https://github.com/qpdf/qpdf/releases/download/vVERSION/qpdf-VERSION.tar.gz"

          - optimization: lto
            cflags: "-O3 -flto"
            ldflags: "-flto"
            before_all: >
              yum install -y libjpeg-turbo-devel libxml2-devel libxslt-devel zlib-devel openssl-devel libxmp &&
              pip install cmake &&
              curl -L https://github.com/qpdf/qpdf/releases/download/v12.3.2/qpdf-12.3.2.tar.gz | tar zx &&
              cd qpdf-12.3.2 &&
              cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_CXX_FLAGS="-O3 -flto" \
              -DCMAKE_C_FLAGS="-O3 -flto" \
              -DCMAKE_INSTALL_PREFIX=/usr/local &&
              cmake --build build --target install -j $(nproc)

            # Don't set QPDF_PATTERN; let setup.py find the system install via pkg-config
            env_extra: >
              PKG_CONFIG_PATH="/usr/local/lib/pkgconfig"
    env:
      CIBW_BUILD: "*-${{ matrix.platform }}"

    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BEFORE_ALL: ${{ matrix.before_all }}
          CIBW_ENVIRONMENT: >
            QPDF_VERSION=12.3.2
            CFLAGS=${{ matrix.cflags }}
            CXXFLAGS=${{ matrix.cflags }}
            LDFLAGS=${{ matrix.ldflags }}
            ${{ matrix.env_extra }}

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.optimization }}
          path: ./wheelhouse/*.whl
