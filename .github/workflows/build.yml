name: Build and upload to PyPI

on:
  push:
    branches:
      - "**"
  pull_request: {}

jobs:
  wheels_linux:
    name: ${{ matrix.platform }} (${{ matrix.optimization }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [manylinux_x86_64]
        optimization: [standard, lto]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        shell: bash
        run: |
          # 1. Common Configuration
          # Set the build selector exactly as the original workflow did
          echo "CIBW_BUILD=*-${{ matrix.platform }}" >> $GITHUB_ENV

          # 2. Optimization Specifics
          if [[ "${{ matrix.optimization }}" == "lto" ]]; then
            echo "Configuring LTO build environment..."

            # --- LTO: Override pyproject.toml settings ---

            # Define CIBW_BEFORE_ALL to build QPDF from source with LTO
            # We use a heredoc (EOF) to safely write the multi-line script to GITHUB_ENV
            {
              echo 'CIBW_BEFORE_ALL<<EOF'
              echo 'yum install -y epel-release &&'
              echo 'yum install -y libjpeg-turbo-devel libxml2-devel libxslt-devel zlib-devel openssl-devel libxmp &&'
              echo 'pip install cmake &&'
              echo 'curl -L https://github.com/qpdf/qpdf/releases/download/v12.3.2/qpdf-12.3.2.tar.gz | tar zx &&'
              echo 'cd qpdf-12.3.2 &&'
              # Verified Flags: Build static, require openssl, skip all extras
              echo 'cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON -DREQUIRE_CRYPTO_OPENSSL=ON -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_FLAGS="-O3 -flto=auto -fPIC" -DCMAKE_C_FLAGS="-O3 -flto=auto -fPIC" -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_DOC=OFF -DINSTALL_EXAMPLES=OFF -DINSTALL_MANUAL=OFF &&'
              echo 'cmake --build build --target libqpdf -j $(nproc) &&'
              echo 'cmake --install build'
              echo 'EOF'
            } >> $GITHUB_ENV

            # Define CIBW_ENVIRONMENT to inject flags and pkg-config path
            # Added quotes around flags for safety as requested
            {
              echo 'CIBW_ENVIRONMENT<<EOF'
              echo 'QPDF_VERSION=12.3.2'
              echo 'PKG_CONFIG_PATH=/usr/local/lib/pkgconfig'
              # Added -fPIC here just in case pikepdf's build script is stripping it
              echo 'CFLAGS="-O3 -flto=auto -fPIC"'
              echo 'CXXFLAGS="-O3 -flto=auto -fPIC"'
              # The --no-as-needed flag forces the linker to include the libs even if it doesn't 
              # see an immediate need for them at that point in the command line.
              echo 'LDFLAGS="-flto=auto -Wl,--no-as-needed -ljpeg -lz -lssl -lcrypto"'
              # Adding LIBS as an extra hint for some setup.py configurations
              echo 'LIBS="-ljpeg -lz -lssl -lcrypto"'
              echo 'EOF'
            } >> $GITHUB_ENV
            
          else
            echo "Standard build: Using upstream defaults."
            # --- STANDARD: Do nothing ---
            # By NOT setting CIBW_BEFORE_ALL or CIBW_ENVIRONMENT here, cibuildwheel
            # will default to reading [tool.cibuildwheel] from pyproject.toml.
            # This guarantees an identical build to the original upstream configuration.
          fi

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.optimization }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
